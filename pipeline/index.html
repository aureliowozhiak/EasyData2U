    <style>
        body { font-family: 'Roboto', sans-serif; }
        .bg-primary { background-color: #004aad; }
        .text-primary { color: #004aad; }
        .bg-secondary { background-color: #f1f3f8; }
        .hover-grow { transition: transform 0.3s ease; }
        .hover-grow:hover { transform: scale(1.05); }
        .container {
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .components {
            width: 200px;
            padding: 10px;
            background-color: #f0f0f0;
            border-radius: 5px;
        }

        .canvas {
            flex-grow: 1;
            min-height: 500px;
            border: 2px dashed #ccc;
            position: relative;
            background-color: #fff;
        }

        .component {
            padding: 10px;
            margin: 5px;
            background-color: #fff;
            border: 1px solid #ccc;
            cursor: move;
            user-select: none;
        }

        .component.extract {
            background-color: #90EE90;
        }

        .component.transform {
            background-color: #87CEEB;
        }

        .component.consolidate {
            background-color: #DDA0DD;
        }

        .component.load {
            background-color: #FFB6C1;
        }

        .pipeline-item {
            position: absolute;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 4px;
            cursor: move;
            min-width: 150px;
            text-align: center;
            background-color: white;
        }

        .item-description {
            margin-top: 8px;
            width: 100%;
            padding: 4px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 12px;
        }

        .delete-button {
            position: absolute;
            top: -10px;
            right: -10px;
            background-color: red;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
        }

        .pipeline-item:hover .delete-button {
            display: flex;
        }

        .connection {
            position: absolute;
            background-color: #333;
            height: 2px;
            transform-origin: left center;
        }

        .color-picker-button {
            position: absolute;
            top: -10px;
            right: 15px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: none;
            cursor: pointer;
            border: 1px solid #ccc;
            padding: 0;
            overflow: hidden;
        }

        .color-picker-input {
            position: absolute;
            width: 30px;
            height: 30px;
            top: -5px;
            left: -5px;
            cursor: pointer;
        }

        .pipeline-item:hover .color-picker-button {
            display: block;
        }

        /* Estilos para os pontos de conexão */
        .connection-point {
            width: 10px;
            height: 10px;
            background-color: #666;
            border: 2px solid #333;
            border-radius: 50%;
            position: absolute;
            cursor: pointer;
        }

        .connection-point.input {
            left: -5px;
            top: 50%;
            transform: translateY(-50%);
        }

        .connection-point.output {
            right: -5px;
            top: 50%;
            transform: translateY(-50%);
        }

        /* Estilo para a linha de conexão sendo desenhada */
        .temp-connection {
            position: absolute;
            height: 2px;
            background-color: #333;
            pointer-events: none;
            transform-origin: left center;
        }

        /* Estilo para conexões existentes */
        .connection-line {
            position: absolute;
            height: 2px;
            background-color: #333;
            transform-origin: left center;
            cursor: pointer;
        }

        .connection-line:hover {
            background-color: #ff0000;
        }
    </style>

    <script>
        const canvas = document.getElementById('canvas');
        let components = [];
        let isDragging = false;
        let currentX = 0;
        let currentY = 0;
        let initialX = 0;
        let initialY = 0;
        let draggedElement = null;

        const save_pipeline = document.getElementById('save_pipeline');

        // Registra o pipeline no local storage
        save_pipeline.addEventListener('click', () => {
            const pipelineItems = document.querySelectorAll('.pipeline-item');
            const pipelineData = Array.from(pipelineItems).map(item => ({
                type: item.classList[1],
                position: {
                    x: parseInt(item.style.left),
                    y: parseInt(item.style.top)
                },
                description: item.querySelector('.item-description').value
            }));
            localStorage.setItem('pipelineData', JSON.stringify(pipelineData));

            const linesConnections = document.querySelectorAll('.connection-line');
            const linesConnectionsData = Array.from(linesConnections).map(line => ({
                left: line.style.left,
                top: line.style.top,
                width: line.style.width,
                transform: line.style.transform
            }));
            localStorage.setItem('linesConnectionsData', JSON.stringify(linesConnectionsData));


        });

        // Ler o pipeline do local storage
        const pipelineData = localStorage.getItem('pipelineData');
        if (pipelineData) {
            const pipelineItems = JSON.parse(pipelineData);
            pipelineItems.forEach(item => {
                createPipelineItem(item.type, item.position.x, item.position.y, item.description);
            });

            

            const linesConnectionsData = localStorage.getItem('linesConnectionsData');
            const linesConnections = JSON.parse(linesConnectionsData);
            
            linesConnections.forEach(line => {
                createConnectionLine(line.left, line.top, line.width, line.transform);
            });
           
        }

        // Limpar o pipeline do local storage
        const clean_pipeline = document.getElementById('clean_pipeline');
        clean_pipeline.addEventListener('click', () => {
            localStorage.removeItem('pipelineData');
            localStorage.removeItem('linesConnectionsData');
            location.reload();
        });


        //exportar o localstorage to a json file
        const export_pipeline = document.getElementById('export_pipeline');
        export_pipeline.addEventListener('click', () => {
            const pipelineData = localStorage.getItem('pipelineData');
            const linesConnectionsData = localStorage.getItem('linesConnectionsData');
            const pipeline = {
                pipelineData: pipelineData,
                linesConnectionsData: linesConnectionsData
            };
            const blob = new Blob([JSON.stringify(pipeline)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'pipeline.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        //importar o localstorage from a json file
        // quando clicar no import_pipeline_button, abrir o input de file
        const import_pipeline_button = document.getElementById('import_pipeline_button');
        import_pipeline_button.addEventListener('click', () => {
            const input = document.getElementById('import_pipeline');
            input.click();
        });

        // quando o input de file mudar, ler o arquivo e importar o pipeline
        const import_pipeline = document.getElementById('import_pipeline');
        import_pipeline.addEventListener('change', (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.readAsText(file);
            reader.onload = () => {
                const pipeline = JSON.parse(reader.result);
                localStorage.setItem('pipelineData', pipeline.pipelineData);
                localStorage.setItem('linesConnectionsData', pipeline.linesConnectionsData);
            };
            location.reload();
        });


        // Adicionar listeners para componentes arrastáveis
        document.querySelectorAll('.component').forEach(component => {
            component.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', component.dataset.type);
            });
        });

        // Configurar área de soltar
        canvas.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        canvas.addEventListener('drop', (e) => {
            e.preventDefault();
            const type = e.dataTransfer.getData('text/plain');
            createPipelineItem(type, e.clientX - canvas.offsetLeft, e.clientY - canvas.offsetTop, '');
        });

        // Função para criar linha de conexão
        function createConnectionLine(left, top, width, transform) {
            // Criar linha permanente
            const line = document.createElement('div');
            line.className = 'connection-line';

            line.style.left = `${left}`;
            line.style.top = `${top}`;
            line.style.width = `${width}`;
            line.style.transform = `${transform}`;

            canvas.appendChild(line);
        }

        function createPipelineItem(type, x, y, description) {
            const item = document.createElement('div');
            item.className = `pipeline-item ${type}`;
            item.innerHTML = `
                ${type === 'extract' ? 'Extrair Dados' :
                type === 'transform' ? 'Transformar' :
                type === 'consolidate' ? 'Consolidar' : 'Carregar'}
                <div class="color-picker-button">
                    <input type="color" class="color-picker-input" title="Mudar cor">
                </div>
                <div class="delete-button">×</div>
                <input type="text" class="item-description" placeholder="Adicione uma descrição..." value="${description}" />
                <div class="connection-point input"></div>
                <div class="connection-point output"></div>
            `;
            item.style.left = `${x}px`;
            item.style.top = `${y}px`;

            const deleteButton = item.querySelector('.delete-button');
            deleteButton.addEventListener('click', (e) => {
                e.stopPropagation();
                removePipelineItem(item);
            });

            const colorPicker = item.querySelector('.color-picker-input');
            colorPicker.addEventListener('input', (e) => {
                e.stopPropagation();
                item.style.backgroundColor = e.target.value;
            });
            colorPicker.addEventListener('mousedown', (e) => {
                e.stopPropagation();
            });

            const descriptionInput = item.querySelector('.item-description');
            descriptionInput.addEventListener('mousedown', (e) => {
                e.stopPropagation();
            });

            // Adicionar manipuladores de eventos para os pontos de conexão
            const connectionPoints = item.querySelectorAll('.connection-point');
            connectionPoints.forEach(point => {
                point.addEventListener('mousedown', startConnection);
            });

            item.addEventListener('mousedown', startDragging);
            components.push(item);
            canvas.appendChild(item);
        }

        function removePipelineItem(item) {
            components = components.filter(component => component !== item);
            item.remove();
        }

        function startDragging(e) {
            isDragging = true;
            draggedElement = e.target;
            initialX = e.clientX - draggedElement.offsetLeft;
            initialY = e.clientY - draggedElement.offsetTop;
        }

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            e.preventDefault();
            currentX = e.clientX - initialX;
            currentY = e.clientY - initialY;

            // Manter o elemento dentro do canvas
            const canvasBounds = canvas.getBoundingClientRect();
            currentX = Math.max(0, Math.min(currentX, canvasBounds.width - draggedElement.offsetWidth));
            currentY = Math.max(0, Math.min(currentY, canvasBounds.height - draggedElement.offsetHeight));

            draggedElement.style.left = `${currentX}px`;
            draggedElement.style.top = `${currentY}px`;
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            draggedElement = null;
        });

        let isDrawingConnection = false;
        let startPoint = null;
        let tempConnection = null;

        function startConnection(e) {
            e.stopPropagation();
            isDrawingConnection = true;
            startPoint = e.target;
            
            // Criar linha temporária
            tempConnection = document.createElement('div');
            tempConnection.className = 'temp-connection';
            tempConnection.style.left = `${e.clientX - canvas.offsetLeft}px`;
            tempConnection.style.top = `${e.clientY - canvas.offsetTop}px`;
            canvas.appendChild(tempConnection);
        }

        canvas.addEventListener('mousemove', (e) => {
            if (isDrawingConnection && tempConnection) {
                const startRect = startPoint.getBoundingClientRect();
                const startX = startRect.left + startRect.width / 2 - canvas.offsetLeft;
                const startY = startRect.top + startRect.height / 2 - canvas.offsetTop;
                const endX = e.clientX - canvas.offsetLeft;
                const endY = e.clientY - canvas.offsetTop;

                // Calcular a distância e o ângulo
                const dx = endX - startX;
                const dy = endY - startY;
                const length = Math.sqrt(dx * dx + dy * dy);
                const angle = Math.atan2(dy, dx) * 180 / Math.PI;

                // Atualizar a linha temporária
                tempConnection.style.left = `${startX}px`;
                tempConnection.style.top = `${startY}px`;
                tempConnection.style.width = `${length}px`;
                tempConnection.style.transform = `rotate(${angle}deg)`;
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            if (isDrawingConnection) {
                const endPoint = document.elementFromPoint(e.clientX, e.clientY);
                
                if (endPoint && endPoint.classList.contains('connection-point') && 
                    endPoint !== startPoint &&
                    ((startPoint.classList.contains('output') && endPoint.classList.contains('input')) ||
                     (startPoint.classList.contains('input') && endPoint.classList.contains('output')))) {
                    
                    // Criar conexão permanente
                    const connection = document.createElement('div');
                    connection.className = 'connection-line';
                    connection.style.cssText = tempConnection.style.cssText;
                    canvas.appendChild(connection);

                    // Adicionar evento de clique duplo para remover a conexão
                    connection.addEventListener('dblclick', () => {
                        connection.remove();
                    });
                }

                // Limpar a conexão temporária
                if (tempConnection) {
                    tempConnection.remove();
                    tempConnection = null;
                }
                
                isDrawingConnection = false;
                startPoint = null;
            }
        });

        // Função para extrair o fluxo - gerar prompt
        document.getElementById('extractFlow').addEventListener('click', () => {
            const pipelineItems = document.querySelectorAll('.pipeline-item');
            let flowText = "Estrutura do Pipeline ETL:\n\n";

                const description = item.querySelector('.item-description').value || 'Sem descrição';
                const position = `(x: ${parseInt(item.style.left)}, y: ${parseInt(item.style.top)})`;
                
                flowText += `${index + 1}. Tipo: ${type}\n`;
                flowText += `   Descrição: ${description}\n`;
                //flowText += `   Posição no canvas: ${position}\n\n`;
            });

            flowText += "Crie um código em python para o pipeline ETL."
